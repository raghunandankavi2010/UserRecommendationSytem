[project]
name = "recsys"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary,pool]>=3.2", "pgvector>=0.5",
       "numpy>=2.0", "sentence-transformers>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matcher = ["migrations/*.sql"]
