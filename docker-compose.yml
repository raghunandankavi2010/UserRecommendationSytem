services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: matcher
      POSTGRES_USER: matcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcher -d matcher"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://matcher:${POSTGRES_PASSWORD}@db:5432/matcher
      API_KEY: ${API_KEY:?set API_KEY in .env}
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"   # weights come from the mounted cache; no Hugging Face token inside the container
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}/hub:/hf/hub:ro
      - ./models:/srv/models:ro   # fine-tuned versions written by ml/jobs.py retrain (create the folder first)
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      start_period: 60s

volumes:
  pgdata:
